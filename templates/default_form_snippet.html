{% for field in form %}
<div class="mb-4">
    {{ field.errors }}
    <label for="{{ field.id_for_label }}" class="block text-gray-700 font-semibold mb-1">
      {{ field.label }}
    </label> {{ field|add_class:"border border-gray-300 rounded px-3 py-2 w-full focus:outline-none focus:ring-2 focus:ring-blue-500" }}
</div>
{% endfor %}
